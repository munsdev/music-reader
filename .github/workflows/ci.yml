name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: dist

  android-debug:
    name: Debug APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: music-reader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    name: Signed test release
    needs: web
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - name: Skip when the signing key is not set up
        if: env.HAS_KEY != 'true'
        run: echo "ANDROID_KEYSTORE_BASE64 is not set, skipping the release."
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build signed APK
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VITE_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          npm ci
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleRelease --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk music-reader.apk
          rm "$RUNNER_TEMP/release.jks"
      - name: Publish release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Manual test build' }}
        run: |
          SHA=$(sha256sum music-reader.apk | cut -d' ' -f1)
          TAG="v$VERSION_NAME"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          node -e '
            const fs = require("fs")
            const notes = (process.env.NOTES || "").split("\n")[0]
            fs.writeFileSync("latest.json", JSON.stringify({
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              apkUrl: process.argv[1],
              sha256: process.argv[2],
              notes,
              publishedAt: new Date().toISOString(),
            }, null, 2))
          ' "$BASE/music-reader.apk" "$SHA"
          gh release create "$TAG" music-reader.apk latest.json --title "Test build $VERSION_NAME" --notes "$NOTES" --latest

  emulator-smoke:
    name: Start on an Android emulator
    needs: android-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: music-reader-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the app and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell am start -n dev.muns.musicreader/.MainActivity
            sleep 25
            adb exec-out screencap -p > screen-start.png
            adb shell input tap 540 2050
            sleep 5
            adb exec-out screencap -p > screen-after-tap.png
            adb logcat -d | grep -iE "Capacitor|chromium|Console|AndroidRuntime|musicreader" | tail -400 > logcat.txt || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulator-smoke
          path: |
            screen-*.png
            logcat.txt
      - name: Attach screenshots to the smoke-test pre-release
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view smoke-test --repo ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create smoke-test --repo ${{ github.repository }} --prerelease --latest=false \
              --title "Emulator smoke test (not an app release)" --notes "Screenshots from the latest CI emulator run."
          gh release upload smoke-test screen-*.png logcat.txt --repo ${{ github.repository }} --clobber
